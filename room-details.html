<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Room Details - RentRoom</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Rent<span>Room</span>
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="rooms.html">Rooms</a>

    </nav>

</header>


<main style="
    max-width:1100px;
    margin:60px auto;
    padding:0 20px;
">

    <div style="
        display:grid;
        grid-template-columns:1.2fr 1fr;
        gap:40px;
    ">

        <img
            src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267"
            alt="Room"
            style="
                width:100%;
                height:450px;
                object-fit:cover;
                border-radius:15px;
            "
        >


        <div>

            <span class="room-tag">
                Available
            </span>

            <h1 style="margin:15px 0;">
                Modern Single Room
            </h1>

            <p style="
                color:#64748b;
                margin-bottom:25px;
            ">
                📍 Bhubaneswar, Odisha
            </p>

            <h2 style="color:#2563eb;">
                ₹7,000 / month
            </h2>

            <hr style="
                margin:25px 0;
                border:0;
                border-top:1px solid #e5e7eb;
            ">


            <h3>Room Details</h3>

            <p style="
                margin-top:15px;
                line-height:1.8;
                color:#475569;
            ">
                Comfortable single room suitable for
                students and working professionals.
                The room is located near major facilities
                and public transport.
            </p>


            <button
                onclick="bookRoom()"
                style="
                    margin-top:30px;
                    width:100%;
                    padding:15px;
                    border:none;
                    background:#2563eb;
                    color:white;
                    border-radius:8px;
                    cursor:pointer;
                    font-size:16px;
                "
            >
                Book This Room
            </button>

        </div>

    </div>

</main>


<script>

function bookRoom() {

    alert(
        "Booking request submitted! " +
        "Backend integration will be added later."
    );

}

</script>

</body>
</html>
