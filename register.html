<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - RentRoom</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Rent<span>Room</span>
    </div>

    <a href="index.html">
        ← Back to Home
    </a>

</header>


<div style="
    max-width:450px;
    margin:60px auto;
    padding:30px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
">

    <h1>Create Account</h1>

    <p style="margin:10px 0 25px;color:#64748b;">
        Join RentRoom today.
    </p>


    <form onsubmit="registerUser(event)">

        <label>Full Name</label>

        <input
            type="text"
            required
            placeholder="Enter your name"
            style="
                width:100%;
                padding:14px;
                margin:8px 0 18px;
                border:1px solid #d1d5db;
                border-radius:8px;
            "
        >


        <label>Email</label>

        <input
            type="email"
            required
            placeholder="Enter your email"
            style="
                width:100%;
                padding:14px;
                margin:8px 0 18px;
                border:1px solid #d1d5db;
                border-radius:8px;
            "
        >


        <label>Password</label>

        <input
            type="password"
            required
            placeholder="Create password"
            style="
                width:100%;
                padding:14px;
                margin:8px 0 20px;
                border:1px solid #d1d5db;
                border-radius:8px;
            "
        >


        <button
            type="submit"
            style="
                width:100%;
                padding:14px;
                border:none;
                background:#2563eb;
                color:white;
                border-radius:8px;
                cursor:pointer;
            "
        >
            Create Account
        </button>

    </form>

</div>


<script>

function registerUser(event) {

    event.preventDefault();

    alert("Account created! Backend will be connected later.");

}

</script>

</body>
</html>
